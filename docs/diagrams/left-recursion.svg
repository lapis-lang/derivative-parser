<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" font-family="sans-serif" font-size="13">
  <title>Left recursion in PwZ — memo seeds and grows</title>
  <rect x="10" y="10" width="500" height="180" fill="none" stroke="#dadce0" stroke-dasharray="4 3"/>
  <text x="20" y="28" fill="#5f6368">Left recursion in PwZ</text>
  <rect x="20" y="50" width="230" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="135" y="75" text-anchor="middle">S called at pos 0 → creates Mem (empty)</text>
  <rect x="270" y="50" width="230" height="40" rx="6" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="385" y="75" text-anchor="middle">S calls S again at pos 0 → same Mem!</text>
  <rect x="20" y="110" width="230" height="40" rx="6" fill="#e6f4ea" stroke="#188038"/>
  <text x="135" y="135" text-anchor="middle">S falls through to '1' → Mem has result</text>
  <rect x="270" y="110" width="230" height="40" rx="6" fill="#e6f4ea" stroke="#188038"/>
  <text x="385" y="135" text-anchor="middle">S called again → Mem has result, reuses</text>
  <line x1="135" y1="90" x2="385" y2="110" stroke="#5f6368"/>
  <line x1="385" y1="90" x2="135" y2="110" stroke="#5f6368"/>
</svg>