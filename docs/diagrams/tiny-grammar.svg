<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="sans-serif" font-size="14">
  <title>Grammar tree for S ::= 'a' 'b'</title>
  <!-- Seq node -->
  <rect x="120" y="20" width="80" height="40" rx="6" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="160" y="45" text-anchor="middle">Seq</text>
  <!-- Tok('a') -->
  <rect x="40" y="120" width="90" height="40" rx="6" fill="#fff" stroke="#5f6368"/>
  <text x="85" y="145" text-anchor="middle">Tok('a')</text>
  <!-- Tok('b') -->
  <rect x="190" y="120" width="90" height="40" rx="6" fill="#fff" stroke="#5f6368"/>
  <text x="235" y="145" text-anchor="middle">Tok('b')</text>
  <!-- edges -->
  <line x1="160" y1="60" x2="85" y2="120" stroke="#5f6368"/>
  <line x1="160" y1="60" x2="235" y2="120" stroke="#5f6368"/>
</svg>